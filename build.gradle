buildscript {
    ext.kotlinVersion = '2.2.21'
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

allprojects {
    apply plugin: "idea"

    version = '1.0'
    ext {
        appName = "crpg"
        // NOTE: gdx is pinned to 1.13.1 rather than the latest (1.14.x) because
        // ktx 1.13.1-rc1 is compiled against exactly that version. Matching ktx's
        // tested pairing is worth more than chasing gdx minors. Bump them together.
        gdxVersion = '1.13.1'
        ktxVersion = "1.13.1-rc1"
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        logbackVersion = "1.5.38"
        quickCheckVersion = "1.0"
        jUnitVersion = "4.13.2"
    }

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: "kotlin"

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Compiled with the installed JDK (21) but emitting 17 bytecode, so no
    // toolchain download is required.
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

project(":desktop") {
    dependencies {
        api project(":core")
        // lwjgl3, not lwjgl2: the lwjgl2 backend has no Apple Silicon native
        // build, which is what stopped this project running on arm64 macOS.
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    }
}

project(":core") {
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
        api "com.badlogicgames.ashley:ashley:$ashleyVersion"
        api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

        // Only the ktx modules actually imported by source. The rest of the
        // suite (async, assets, graphics, i18n, actors, style) had zero
        // references and was dropped.
        api "io.github.libktx:ktx-app:$ktxVersion"
        api "io.github.libktx:ktx-ashley:$ktxVersion"
        api "io.github.libktx:ktx-collections:$ktxVersion"
        api "io.github.libktx:ktx-inject:$ktxVersion"
        api "io.github.libktx:ktx-log:$ktxVersion"
        api "io.github.libktx:ktx-math:$ktxVersion"

        // Logging (slf4j-api arrives transitively via logback)
        api "ch.qos.logback:logback-classic:$logbackVersion"

        testImplementation "com.pholser:junit-quickcheck-core:$quickCheckVersion"
        testImplementation "com.pholser:junit-quickcheck-generators:$quickCheckVersion"
        testImplementation "junit:junit:$jUnitVersion"
    }
}
