import org.gradle.internal.os.OperatingSystem

sourceSets.main.java.srcDirs = ["src/"]

project.ext.mainClassName = "com.ancient.game.crpg.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets")

tasks.register('run', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        // Mandatory for LWJGL3 on macOS: GLFW must own the first thread.
        jvmArgs += "-XstartOnFirstThread"
    }
    // Carried over from the 2023 revival work: keeps JVM hot-reload usable
    // for longer before the code cache fills.
    jvmArgs += "-XX:ReservedCodeCacheSize=512m"

    // Forward every crpg.* property into the forked JVM; Gradle does not pass
    // -D through automatically. Used by Screenshot.kt and the scripted demos.
    //   ./gradlew :desktop:run -Dcrpg.capture=60 -Dcrpg.capture.out=/tmp/frame.png
    //   ./gradlew :desktop:run -Dcrpg.demo=move -Dcrpg.capture=240
    System.properties.each { key, value ->
        if (key.toString().startsWith("crpg.")) {
            systemProperty key.toString(), value.toString()
        }
    }
}

tasks.register('debug', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true

    if (OperatingSystem.current() == OperatingSystem.MAC_OS) {
        jvmArgs += "-XstartOnFirstThread"
    }
}

tasks.register('dist', Jar) {
    dependsOn classes
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from project.assetsDir
    with jar
}
